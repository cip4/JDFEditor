FurtherDevView=<br><font size\=3><b>Sugerencias para desarrollo futuro</b></font><br>Las siguientes funciones no se han implementado en el editor CIP4 JDF<br>y esta es una sugerencia de funciones para añadir a la aplicación;<ul type\="circle"><li>Validación de esquema</li><li>Deshacer y rehacer</li><li>Vista de origen</li><li>Mejorar la validación después de editar</li><li>Mejorar el soporte de JMF</li><li>Cambiar directamente el texto de comentario en la vista de comentarios</li></ul>Otra posible función para añadir es la capacidad de ejecutar el proceso JDF<br>asociado al archivo JDF mostrado en el editor con la URL de retorno configurada<br>para notificar al editor, de modo que pueda recargarse automáticamente después de la<br>ejecución del proceso. Esto permitiría al usuario ver cómo la ejecución del proceso modifica<br>el JDF y disponer de un medio rápido para probar procesos.<br><br>Otra función adicional es implementar la capacidad de construir una tabla con<br>punto de partida en un archivo JDF. Los elementos de la tabla contendrán información sobre<br>todos los procesos, recursos y atributos posibles en el archivo JDF. Esta tabla<br>será útil para fines de interoperabilidad.<br><br><font size\=3><b>Problemas con la máquina virtual de Java</b></font><br>Si el CIP4 JDFEditor tiene problemas para encontrar su máquina virtual de Java, abra el archivo<br>JDFEditor.prop con un editor de texto, por ejemplo el Bloc de notas de Windows, y añada un \# delante<br>de la línea\:<br><br><b>jdkversion \= 1.4.2 1.4.1 1.4 1.3</b><br><br>para que la aplicación de inicio no lea esa línea, o simplemente elimínela.<br>Después, añada una nueva línea\:<br><br><b>javadllpath \= c\:\\<i>path</i>\\jvm.dll</b><br><br>donde<i> path </i>es la ruta en la que se encuentra su archivo jvm.dll en el<br>directorio de su entorno de ejecución de Java (JRE). Esto debería resolver cualquier problema<br>experimentado con la máquina virtual de Java.<br><br><font size\=3><b>Construcción de un archivo .jar</b></font><br>Al construir un archivo .jar se deben realizar algunos cambios en ciertas clases. Las<br>clases afectadas, y el número de cambios que deben hacerse en ellas, son las<br>siguientes\:<ul type\="circle"><li>JDFFrame          dos cambios</li><li>HelpFrame         dos cambios</li><li>PreferenceDialog  un cambio</li><li>INIReader         un cambio</li></ul>Los cambios que se deben hacer consisten en comentar y descomentar varias líneas en el código<br>que inicializa los ImageIcons. La razón es que los archivos GIF puedan quedar<br>incluidos en el archivo .jar.<br><br>Incluya los siguientes recursos al exportar un archivo .jar\:<ul type\="circle"><li>JDFEditor/src</li><li>JDFEditor/icons</li><li>JDFLib/src</li><li>Xerces/src</li></ul>
