ProcessView=<br><font size\=3><b>Vista de proceso</b></font><br>Al hacer clic en un nodo JDF en la vista de árbol, se dibujará la vista de proceso para ese nodo.<br>La vista de entrada y salida se selecciona automáticamente; para ver los procesos haga clic en<br>la pestaña Vista de proceso. Desde aquí es posible navegar por los procesos haciendo<br>clic con el botón izquierdo del ratón en un nodo JDF; entonces se mostrará el proceso que ese nodo<br>describe. Un clic con el botón izquierdo sobre un recurso seleccionará<br>ese recurso en la vista de árbol. Para mostrar los procesos del nodo JDF padre<br>del nodo JDF mostrado, vaya a la barra de menú y haga clic en el botón\:
