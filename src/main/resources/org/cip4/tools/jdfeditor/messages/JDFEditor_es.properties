InOutView=<br><font size\=3><b>Vista de entrada y salida</b></font><br>Al hacer clic en un nodo JDF, Recurso o Enlace de recurso en la vista de árbol se activará<br>la vista de entrada y salida. El nodo seleccionado se muestra en el centro de la<br>vista de entrada y salida, y sus recursos de entrada y salida, así como su consumidor y productor<br>JDF, se muestran a los lados. Al hacer doble clic en un enlace de recurso, el<br>enlace se sigue hasta su recurso, que se muestra en el centro como se describe<br>arriba.<br>Al hacer clic con el botón derecho del ratón en uno de los nodos laterales,<br>ese nodo se colocará en el centro y sus recursos de entrada y salida o su consumidor y productor<br>JDF se mostrarán a los lados. Un clic con el botón izquierdo del ratón<br>seleccionará el nodo correspondiente en la vista de árbol.
