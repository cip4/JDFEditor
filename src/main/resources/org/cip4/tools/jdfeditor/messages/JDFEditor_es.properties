ErrorView=<br><font size\=3><b>Vista de errores</b></font><br>En la vista de errores se muestran los errores cuando el archivo se valida y contiene<br>errores. Al hacer clic en un nodo en la vista de árbol, los errores de ese nodo y de todos<br>sus hijos se enumeran en la vista de errores. Un clic en el nodo JDF padre<br>mostrará por lo tanto los errores de todo el archivo. Si el nodo es válido, la vista de errores<br>aparece en blanco. Si se hace clic en un elemento de la vista de errores, el nodo correspondiente en<br>el árbol queda seleccionado.<br>
