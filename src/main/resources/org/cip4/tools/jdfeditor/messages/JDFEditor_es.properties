GettingStarted=<br><b>La aplicación maneja archivos JDF y JMF</b><br><br>Es posible abrir un archivo existente o crear un nuevo archivo JDF o JMF. Puede<br>abrir un archivo con el<b> botón Abrir</b>, el comando<b> Abrir </b>del<b> menú Archivo</b>, la<br>tecla rápida<b> Ctrl+O </b>o<b> arrastrando y soltando </b>un archivo en el área de vista de árbol desde el<br>Explorador de Windows o desde el escritorio.<br><br>El idioma predeterminado es el inglés. El idioma puede cambiarse en las<b> opciones</b><br>de<b> Idioma </b>dentro de<b> Preferencias</b>. Los idiomas disponibles actualmente son\:<ul type\="circle"><li>Inglés</li><li>Francés</li><li>Alemán</li><li>Español</li><li>Sueco</li></ul>Solo los nombres de botones, menús y mensajes de error están internacionalizados. Para aplicar la nueva<br>configuración de idioma después de cambiarlo debe<b> reiniciar </b>la aplicación.<br><br>La apariencia puede cambiarse durante la ejecución en las<b> opciones de Preferencias</b>, en la<br>pestaña<b> Apariencia </b>.<br><br>La función<b> Buscar </b>es válida en la vista de árbol, la vista de errores y en la<br>vista de entrada y salida. La función Buscar puede accederse desde el<b> menú Editar </b>o mediante<br>la tecla rápida<b> Ctrl+F</b>.<br><br>Es posible resaltar espacios de nombres ajenos y elementos privados. Para hacerlo, haga clic<br>en el elemento<b> Resaltar espacios de nombres ajenos/elementos privados </b>del<b> menú Validación</b>.<br><br>Es posible ocultar atributos en la vista de árbol haciendo clic en el elemento<b> Mostrar atributos<br>en la vista de árbol </b>del<b> menú Validación</b>. También es posible<b> Mostrar atributos heredados<br>en la vista de árbol</b>. Esta opción también se encuentra en el menú Validación.<br>
