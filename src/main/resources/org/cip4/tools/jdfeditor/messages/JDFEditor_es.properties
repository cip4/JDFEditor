EditView=<br>La edición es posible desde la vista de árbol. Las opciones de edición para el nodo seleccionado<br>están disponibles en un<b> menú emergente</b>, que se muestra al hacer clic con el<br>botón derecho del ratón, y también en los<b> menús Editar </b>e<b> Insertar</b>. Al insertar un nuevo<br>elemento o atributo, solo son válidas las opciones permitidas.<br><br>En las opciones de<b> Preferencias</b>, que se encuentran en el<b> menú Herramientas</b>, puede elegir<br>abrir un archivo en modo<b> solo lectura </b>en la pestaña<b> General </b>. Eso significa que el archivo no puede<br>editarse si se abrió con la opción Solo lectura seleccionada. Después de abrir un archivo<br>no es posible cambiar el modo de edición. Para habilitar la edición, el archivo debe<br>cerrarse, desactivar la opción Solo lectura y volver a abrir el archivo.<br><br>Las funciones Deshacer y Rehacer aún no están disponibles...<br>
