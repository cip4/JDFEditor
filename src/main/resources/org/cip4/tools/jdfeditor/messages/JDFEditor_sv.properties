EditView=<br>Redigering är möjlig från trädvyn. Redigeringsalternativen för den valda noden finns i en<b> popup-meny</b>, som visas när du klickar med höger musknapp, och även i menyerna<b> Redigera </b>och<b> Infoga</b>. När du infogar ett nytt element eller attribut är endast giltiga alternativ valbara.<br><br>I alternativen för<b> Inställningar </b>, som finns i<b> Verktygsmenyn</b>, kan du välja att öppna en fil<b> skrivskyddad </b>under fliken<b> Allmänt </b>. Det betyder att filen inte kan redigeras om den öppnades med alternativet skrivskyddat valt. Efter att en fil har öppnats går det inte att ändra redigeringsläget. För att aktivera redigering måste filen stängas, alternativet skrivskyddat stängas av och filen öppnas igen.<br><br>Funktionerna Ångra och Gör om stöds ännu inte...<br>
