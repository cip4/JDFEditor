FurtherDevView=<br><font size\=3><b>Förslag på vidareutveckling</b></font><br>Följande funktioner har ännu inte implementerats i CIP4 JDF Editor<br>och detta är ett förslag på funktioner att lägga till i applikationen;<ul type\="circle"><li>Schemavalidering</li><li>Ångra och Gör om</li><li>Källkodsvy</li><li>Förbättra valideringen efter redigering</li><li>Utöka JMF-stödet</li><li>Ändra kommentartext direkt i kommentarvyn</li></ul>En annan möjlig funktion att lägga till är möjligheten att köra JDF-processen<br>som är kopplad till JDF-filen som visas i editorn, med retur-URL konfigurerad<br>för att meddela editorn så att den kan laddas om automatiskt efter att processen<br>har körts. Detta skulle göra det möjligt för användaren att se hur processkörningen ändrar<br>JDF och ge ett snabbt sätt att testa processer.<br><br>Ytterligare en funktion är att införa möjligheten att sätta samman en tabell med<br>utgångspunkt i en JDF-fil. Tabellelementen kommer att innehålla information om<br>alla möjliga processer, resurser och attribut i JDF-filen. Denna tabell<br>kommer att vara användbar för interoperabilitet.<br><br><font size\=3><b>Problem med Java VM</b></font><br>Om CIP4 JDFEditor har problem med att hitta din Java Virtual Machine, öppna<br>filen JDFEditor.prop med en textredigerare, t.ex. Windows Notepad, och lägg till ett \# framför<br>raden\:<br><br><b>jdkversion \= 1.4.2 1.4.1 1.4 1.3</b><br><br>så att startapplikationen inte läser den raden, eller ta helt enkelt bort den.<br>Lägg därefter till en ny rad\:<br><br><b>javadllpath \= c\:\\<i>path</i>\\jvm.dll</b><br><br>där<i> path </i>är sökvägen till platsen där din jvm.dll-fil finns i din<br>Java Runtime Environment (JRE)-katalog. Detta bör lösa alla problem<br>som upplevs med Java VM.<br><br><font size\=3><b>Bygga en .jar-fil</b></font><br>När du bygger en .jar-fil måste ett par ändringar göras i vissa klasser. De<br>berörda klasserna, och antalet ändringar som måste göras i dem, är<br>följande\:<ul type\="circle"><li>JDFFrame          Två ändringar</li><li>HelpFrame         Två ändringar</li><li>PreferenceDialog  En ändring</li><li>INIReader         En ändring</li></ul>Ändringarna som ska göras är att kommentera och avkommentera ett antal rader i koden<br>som initierar ImageIcons. Anledningen till detta är att GIF-filerna ska kunna<br>inkluderas i .jar-filen.<br><br>Inkludera följande resurser när du exporterar en .jar-fil\:<ul type\="circle"><li>JDFEditor/src</li><li>JDFEditor/icons</li><li>JDFLib/src</li><li>Xerces/src</li></ul>
