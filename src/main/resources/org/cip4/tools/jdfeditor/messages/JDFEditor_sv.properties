GettingStarted=<br><b>Applikationen hanterar JDF- och JMF-filer</b><br><br>Det går att öppna en befintlig fil eller skapa en ny JDF- och JMF-fil. Du kan öppna en fil antingen med<b> Öppna-knappen</b>, kommandot<b> Öppna </b>i<b> Arkiv-menyn</b>, snabbtangenten<b> Ctrl+O </b>eller genom att<b> dra och släppa </b>en fil till trädvyområdet från Windows<br>Utforskaren eller från skrivbordet.<br><br>Standardspråket är engelska. Språket kan ändras i<b> Inställningar</b>-alternativen under fliken<b> Språk </b>. Tillgängliga språk just nu är\:<ul type\="circle"><li>Engelska</li><li>Franska</li><li>Tyska</li><li>Spanska</li><li>Svenska</li></ul>Endast knappnamn, menyer och felmeddelanden är internationaliserade. För att tillämpa de nya språkinställningarna efter språkbyte måste du<b> starta om </b>applikationen.<br><br>Look & Feel kan ändras under körning i<b> Inställningar </b>under fliken<b> Look & Feel </b>.<br><br>Funktionen<b> Sök </b>är giltig i trädvyn, felvyn och i in- och utdata-vyn. Sökfunktionen kan nås från<b> Redigera-menyn </b>eller med snabbtangenten<b> Ctrl+F</b>.<br><br>Det går att markera främmande namnrymder och privata element. För att göra det klickar du på alternativet<b> Markera främmande namnrymder/privata element </b>i<b> Valideringsmenyn</b>.<br><br>Det går att dölja attribut i trädvyn genom att klicka på alternativet<b> Visa attribut i trädvyn </b>i<b> Valideringsmenyn</b>. Det går också att<b> visa ärvda attribut i trädvyn</b>. Detta alternativ finns också i valideringsmenyn.<br>
