GettingStarted=<br><b>L'application gère les fichiers JDF et JMF</b><br><br>Vous pouvez ouvrir un fichier existant ou créer un nouveau fichier JDF ou JMF. Vous pouvez<br>ouvrir un fichier via le<b> bouton Ouvrir</b>, la commande<b> Ouvrir </b>du<b> menu Fichier</b>, le<br>raccourci<b> Ctrl+O </b>ou par<b> glisser-déposer </b>depuis l'Explorateur Windows ou le Bureau<br>vers la zone de vue arborescente.<br><br>La langue par défaut est l'anglais. Vous pouvez changer la langue dans les options<b> Préférences</b><br>sous l'onglet<b> Langue </b>. Les langues disponibles sont actuellement\:<ul type\="circle"><li>Anglais</li><li>Français</li><li>Allemand</li><li>Espagnol</li><li>Suédois</li></ul>Seuls les noms des boutons, les menus et les messages d'erreur sont internationalisés. Pour appliquer<br>la nouvelle langue après modification, vous devez<b> redémarrer </b>l'application.<br><br>Le Look & Feel peut être changé pendant l'exécution dans les options<b> Préférences </b>sous l'onglet<br><b>Look & Feel </b>.<br><br>La fonction<b> Rechercher </b>est disponible dans la vue arborescente, la vue des erreurs et la<br>vue In- & Output. Elle est accessible depuis le<b> menu Édition </b>ou via le<br>raccourci<b> Ctrl+F</b>.<br><br>Il est possible de surligner les espaces de noms externes et les éléments privés via<br>l'option<b> Highlight Foreign Namespaces/Private Elements </b>du<b> menu Validation</b>.<br><br>Vous pouvez aussi masquer les attributs dans la vue arborescente en cliquant sur<b> Show Attributes<br>in Tree View </b>dans le<b> menu Validation</b>. Vous pouvez également<b> afficher les attributs hérités<br>dans la vue arborescente</b>. Cette option est aussi présente dans le menu Validation.<br>
