EditView=<br>L'édition est possible depuis la vue arborescente. Les options d'édition du nœud sélectionné<br>sont disponibles dans un<b> menu contextuel</b>, affiché par un clic de souris avec le<br>bouton droit, ainsi que dans les menus<b> Édition </b>et<b> Insertion</b>. Lors de l'insertion d'un nouvel<br>élément ou attribut, seules les options valides sont proposées.<br><br>Dans les options<b> Preferences </b>du<b> menu Tools</b>, vous pouvez choisir<br>d'ouvrir un fichier en<b> lecture seule </b>sous l'onglet<b> General </b>. Cela signifie que le fichier ne peut pas être<br>modifié s'il a été ouvert avec l'option lecture seule activée. Après ouverture d'un fichier, il<br>n'est pas possible de changer le mode d'édition. Pour réautoriser l'édition, le fichier doit être<br>fermé, l'option lecture seule désactivée, puis le fichier doit être ouvert à nouveau.<br><br>Les fonctions Annuler et Rétablir ne sont pas encore prises en charge...<br>
