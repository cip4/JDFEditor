FurtherDevView=<br><font size\=3><b>Suggestions de développements futurs</b></font><br>Les fonctionnalités suivantes n'ont pas encore été implémentées dans le CIP4 JDF Editor<br>et constituent des suggestions d'amélioration de l'application\:<ul type\="circle"><li>Validation de schéma</li><li>Annuler et Rétablir</li><li>Vue source</li><li>Améliorer la validation après modification</li><li>Renforcer la prise en charge de JMF</li><li>Modifier directement le texte du commentaire dans la vue des commentaires</li></ul>Une autre fonctionnalité possible serait la capacité d'exécuter le processus JDF<br>associé au fichier JDF affiché dans l'éditeur, avec l'URL de retour configurée<br>pour notifier l'éditeur afin qu'il puisse être rechargé automatiquement après<br>l'exécution du processus. Cela permettrait à l'utilisateur de voir comment l'exécution<br>du processus modifie le JDF et d'offrir un moyen rapide de tester les processus.<br><br>Une autre évolution serait d'implémenter la possibilité de créer un tableau à partir d'un<br>fichier JDF. Les éléments du tableau contiendraient des informations sur tous les processus,<br>ressources et attributs possibles du fichier JDF. Ce tableau serait utile pour les besoins<br>d'interopérabilité.<br><br><font size\=3><b>Problème avec la machine virtuelle Java</b></font><br>Si le CIP4 JDFEditor rencontre des problèmes pour trouver votre machine virtuelle Java, ouvrez le<br>fichier JDFEditor.prop avec un éditeur de texte, par exemple le Bloc-notes Windows, puis ajoutez un \# devant<br>la ligne\:<br><br><b>jdkversion \= 1.4.2 1.4.1 1.4 1.3</b><br><br>afin que l'application de démarrage ne lise pas cette ligne, ou supprimez-la simplement.<br>Ajoutez ensuite une nouvelle ligne\:<br><br><b>javadllpath \= c\:\\<i>path</i>\\jvm.dll</b><br><br>où<i> path </i>est le chemin vers le fichier jvm.dll de votre<br>répertoire Java Runtime Environment (JRE). Cela devrait résoudre tout problème<br>rencontré avec la machine virtuelle Java.<br><br><font size\=3><b>Construction d'un fichier .jar</b></font><br>Lors de la construction d'un fichier .jar, quelques modifications doivent être faites dans certaines classes. Les<br>classes concernées, ainsi que le nombre de modifications à y effectuer, sont les suivantes\:<ul type\="circle"><li>JDFFrame          Deux modifications</li><li>HelpFrame         Deux modifications</li><li>PreferenceDialog  Une modification</li><li>INIReader         Une modification</li></ul>Les changements à effectuer consistent à commenter et décommenter plusieurs lignes du code<br>qui initialise les ImageIcons. La raison est que les fichiers GIF doivent être<br>inclus dans le fichier .jar.<br><br>Incluez les ressources suivantes lors de l'export d'un fichier .jar\:<ul type\="circle"><li>JDFEditor/src</li><li>JDFEditor/icons</li><li>JDFLib/src</li><li>Xerces/src</li></ul>
